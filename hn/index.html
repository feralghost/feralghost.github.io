<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN Reader | feralghost</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #222;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo-icon {
            color: #ff6600;
            font-size: 1.5rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }
        h1 a {
            color: #fff;
            text-decoration: none;
        }
        h1 a:hover {
            color: #4a9eff;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .refresh-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .refresh-toggle input {
            accent-color: #4a9eff;
        }
        .refresh-toggle:hover {
            color: #888;
        }
        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 0.4rem 0.8rem;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            color: #fff;
            border-color: #4a9eff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            font-size: 0.8rem;
            color: #444;
            text-align: center;
            margin-bottom: 1rem;
        }
        .stories {
            list-style: none;
        }
        .story {
            padding: 0.75rem 0;
            border-bottom: 1px solid #1a1a1a;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .story:last-child {
            border-bottom: none;
        }
        .story-rank {
            color: #444;
            font-size: 0.85rem;
            margin-right: 0.5rem;
        }
        .story-title {
            color: #e0e0e0;
            text-decoration: none;
            transition: color 0.2s;
        }
        .story-title:hover {
            color: #4a9eff;
        }
        .story-domain {
            color: #555;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
        .story-meta {
            margin-top: 0.35rem;
            font-size: 0.8rem;
            color: #555;
        }
        .story-meta a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        .story-meta a:hover {
            color: #4a9eff;
        }
        .points {
            color: #ff6600;
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #444;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #222;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            text-align: center;
            padding: 2rem;
            color: #ff4444;
        }
        .back-link {
            display: inline-block;
            color: #555;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #4a9eff;
        }
        footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #222;
            text-align: center;
        }
        footer a {
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
        }
        footer a:hover {
            color: #666;
        }
        @media (max-width: 600px) {
            .container { padding: 1rem 0.75rem; }
            header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; justify-content: space-between; }
            .story { padding: 1rem 0; }
            .story-domain { display: block; margin: 0.25rem 0 0 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">📰</span>
                <h1><a href="/">feralghost</a> / hn</h1>
            </div>
            <div class="controls">
                <label class="refresh-toggle">
                    <input type="checkbox" id="autoRefresh">
                    auto-refresh
                </label>
                <button class="btn" id="refreshBtn" onclick="loadStories()">refresh</button>
            </div>
        </header>

        <div class="status" id="status"></div>
        
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Loading top stories...</div>
            </div>
        </div>

        <footer>
            <a href="/">← back to feralghost</a>
        </footer>
    </div>

    <script>
        const HN_API = 'https://hacker-news.firebaseio.com/v0';
        const STORY_COUNT = 20;
        const REFRESH_INTERVAL = 60000; // 1 minute
        
        let refreshTimer = null;
        let lastUpdated = null;

        async function fetchJson(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor(Date.now() / 1000 - timestamp);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        function getDomain(url) {
            if (!url) return null;
            try {
                const hostname = new URL(url).hostname;
                return hostname.replace(/^www\./, '');
            } catch {
                return null;
            }
        }

        function renderStory(story, rank) {
            const domain = getDomain(story.url);
            const hnUrl = `https://news.ycombinator.com/item?id=${story.id}`;
            const titleUrl = story.url || hnUrl;
            
            return `
                <li class="story">
                    <div>
                        <span class="story-rank">${rank}.</span>
                        <a class="story-title" href="${titleUrl}" target="_blank" rel="noopener">${escapeHtml(story.title)}</a>
                        ${domain ? `<span class="story-domain">(${domain})</span>` : ''}
                    </div>
                    <div class="story-meta">
                        <span class="points">${story.score} points</span>
                        by ${escapeHtml(story.by)} 
                        ${timeAgo(story.time)} · 
                        <a href="${hnUrl}" target="_blank" rel="noopener">${story.descendants || 0} comments</a>
                    </div>
                </li>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (lastUpdated) {
                const time = lastUpdated.toLocaleTimeString();
                const autoOn = document.getElementById('autoRefresh').checked;
                statusEl.textContent = `Updated at ${time}${autoOn ? ' · auto-refresh on' : ''}`;
            }
        }

        async function loadStories() {
            const content = document.getElementById('content');
            const refreshBtn = document.getElementById('refreshBtn');
            
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'loading...';

            try {
                // Fetch top story IDs
                const topIds = await fetchJson(`${HN_API}/topstories.json`);
                const ids = topIds.slice(0, STORY_COUNT);

                // Fetch story details in parallel
                const stories = await Promise.all(
                    ids.map(id => fetchJson(`${HN_API}/item/${id}.json`))
                );

                // Render stories
                const html = `
                    <ul class="stories">
                        ${stories.map((story, i) => renderStory(story, i + 1)).join('')}
                    </ul>
                `;
                content.innerHTML = html;
                lastUpdated = new Date();
                updateStatus();

            } catch (err) {
                console.error('Failed to load stories:', err);
                content.innerHTML = `
                    <div class="error">
                        <p>Failed to load stories. Please try again.</p>
                        <p style="font-size: 0.8rem; color: #666; margin-top: 0.5rem">${err.message}</p>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'refresh';
            }
        }

        function toggleAutoRefresh() {
            const enabled = document.getElementById('autoRefresh').checked;
            
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            
            if (enabled) {
                refreshTimer = setInterval(loadStories, REFRESH_INTERVAL);
            }
            
            updateStatus();
            localStorage.setItem('hn-auto-refresh', enabled);
        }

        // Initialize
        document.getElementById('autoRefresh').addEventListener('change', toggleAutoRefresh);
        
        // Restore auto-refresh preference
        const savedPref = localStorage.getItem('hn-auto-refresh');
        if (savedPref === 'true') {
            document.getElementById('autoRefresh').checked = true;
            toggleAutoRefresh();
        }
        
        // Load stories on page load
        loadStories();

        console.log('%c👻 feralghost/hn', 'font-size: 16px; color: #4a9eff; background: #0a0a0a; padding: 8px;');
    </script>
</body>
</html>
